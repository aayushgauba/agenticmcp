[package]
name = "agentic-jwt"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Experimental Rust implementation of the Agentic JWT delegation model"
publish = false

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2"
url = "2.5"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
zeroize = "1.9"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }

[lints.rust]
unsafe_code = "forbid"
